name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update vite config for base path
        run: |
          cat > vite.config.ts << 'EOF'
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'
          import { viteStaticCopy } from 'vite-plugin-static-copy'
          import { normalizePath } from 'vite'
          import path from 'node:path'

          export default defineConfig({
            plugins: [
              react(),
              viteStaticCopy({
                targets: [
                  {
                    src: normalizePath(path.join('node_modules', 'cesium', 'Build', 'Cesium', 'Workers')),
                    dest: 'cesium/Workers',
                  },
                  {
                    src: normalizePath(path.join('node_modules', 'cesium', 'Build', 'Cesium', 'ThirdParty')),
                    dest: 'cesium/ThirdParty',
                  },
                  {
                    src: normalizePath(path.join('node_modules', 'cesium', 'Build', 'Cesium', 'Assets')),
                    dest: 'cesium/Assets',
                  },
                  {
                    src: normalizePath(path.join('node_modules', 'cesium', 'Build', 'Cesium', 'Widgets')),
                    dest: 'cesium/Widgets',
                  },
                ],
              }),
            ],
            base: '/TGP-Land-Viewer-Claude-/',
            define: {
              CESIUM_BASE_URL: JSON.stringify('/TGP-Land-Viewer-Claude-/cesium'),
            },
          })
          EOF

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
