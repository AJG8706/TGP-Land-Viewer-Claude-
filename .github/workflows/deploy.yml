name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine base path
        id: base-path
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "path=/TGP-Land-Viewer-Claude-/" >> $GITHUB_OUTPUT
            echo "deploy-path=." >> $GITHUB_OUTPUT
          else
            BRANCH_NAME=$(echo ${{ github.ref }} | sed 's|refs/heads/||' | sed 's|/|-|g')
            echo "path=/TGP-Land-Viewer-Claude-/preview/$BRANCH_NAME/" >> $GITHUB_OUTPUT
            echo "deploy-path=preview/$BRANCH_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Update vite config for base path
        run: |
          cat > vite.config.ts << 'EOF'
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'

          export default defineConfig({
            plugins: [react()],
            base: '${{ steps.base-path.outputs.path }}',
          })
          EOF

      - name: Build
        run: npm run build

      - name: Check if gh-pages branch exists
        id: check-branch
        run: |
          if git ls-remote --heads origin gh-pages | grep gh-pages; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout gh-pages branch (if exists)
        if: steps.check-branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: Initialize gh-pages directory (if new)
        if: steps.check-branch.outputs.exists == 'false'
        run: |
          mkdir gh-pages-dir
          cd gh-pages-dir
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -b gh-pages
          echo "# TGP Land Viewer" > README.md
          git add README.md
          git commit -m "Initialize gh-pages"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Deploy to gh-pages
        run: |
          # Create directory structure
          mkdir -p gh-pages-dir/${{ steps.base-path.outputs.deploy-path }}

          # Copy build files
          cp -r dist/* gh-pages-dir/${{ steps.base-path.outputs.deploy-path }}/

          # Create/update index for previews
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            mkdir -p gh-pages-dir/preview
            cd gh-pages-dir/preview
            cat > index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>TGP Land Viewer - Preview Branches</title>
            <style>
              body { font-family: system-ui; max-width: 800px; margin: 50px auto; padding: 20px; }
              h1 { color: #333; }
              ul { list-style: none; padding: 0; }
              li { margin: 10px 0; }
              a { color: #0066cc; text-decoration: none; padding: 10px; display: block;
                  border: 1px solid #ddd; border-radius: 5px; }
              a:hover { background: #f5f5f5; }
            </style>
          </head>
          <body>
            <h1>TGP Land Viewer - Preview Branches</h1>
            <ul>
          HTMLEOF

            for dir in */; do
              echo "<li><a href='${dir}'>$(basename $dir)</a></li>" >> index.html
            done

            echo "</ul></body></html>" >> index.html
            cd ../..
          fi

          cd gh-pages-dir
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Deploy ${{ github.ref }} to GitHub Pages" || echo "No changes to commit"
          git push origin gh-pages

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref.replace(/\//g, '-');
            const previewUrl = `https://ajg8706.github.io/TGP-Land-Viewer-Claude-/preview/${branchName}/`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 **Preview deployed!**\n\n✨ Preview URL: ${previewUrl}\n\n📋 [View all previews](https://ajg8706.github.io/TGP-Land-Viewer-Claude-/preview/)`
            });
